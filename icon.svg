    <circle cx="9" cy="7" r="5" fill="#cf8e48"/>
    <circle cx="23" cy="7" r="5" fill="#cf8e48"/>
    <circle cx="16" cy="17" r="13" fill="#f2b76b"/>
    <circle cx="9" cy="21" r="5" fill="#fff2d8"/>
    <circle cx="23" cy="21" r="5" fill="#fff2d8"/>
    <circle cx="11" cy="14" r="2" fill="#2a1a12"/>
    <circle cx="21" cy="14" r="2" fill="#2a1a12"/>
  </g>
</svg>
